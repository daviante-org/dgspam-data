<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 336 56" width="336" height="56">
  <defs>
    <!-- Primary Enterprise Crimson Gradient -->
    <linearGradient id="dg-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="50%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#9F1239" />
    </linearGradient>

    <!-- Subtle Top-Down Specular Highlight for Container -->
    <linearGradient id="dg-border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Left Illuminated Filter Facet -->
    <linearGradient id="filter-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFE4E6" />
    </linearGradient>

    <!-- Right Shaded Filter Facet (3D Bevel) -->
    <linearGradient id="filter-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FECDD3" />
      <stop offset="100%" stop-color="#FDA4AF" />
    </linearGradient>

    <!-- Soft Drop Shadow for Filter Mark -->
    <filter id="mark-shadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#881337" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- ICON MARK (44x44 Squircle anchored at x=6, y=6) -->
  <g transform="translate(6, 6)">
    <!-- Base Squircle -->
    <rect width="44" height="44" rx="12" fill="url(#dg-bg)" />
    <!-- Inner Bevel Highlight -->
    <rect x="0.5" y="0.5" width="43" height="43" rx="11.5" fill="none" stroke="url(#dg-border)" stroke-width="1" />

    <!-- Subtle Background Threat Radar Sweep Ring -->
    <circle cx="22" cy="20" r="15.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="4 2" />

    <!-- 3D Faceted Threat Filter / Sieve -->
    <g filter="url(#mark-shadow)">
      <!-- Left Illuminated Funnel & Stem Half -->
      <path d="M 8,10 L 22,10 L 22,37 L 18.5,34.5 L 18.5,23.5 L 8,12.5 Z" fill="url(#filter-left)" />
      <!-- Right Shaded Funnel & Stem Half -->
      <path d="M 36,10 L 22,10 L 22,37 L 25.5,34.5 L 25.5,23.5 L 36,12.5 Z" fill="url(#filter-right)" />

      <!-- Inner Crimson Analysis Chamber -->
      <path d="M 13,13 L 31,13 L 24,20.5 L 20,20.5 Z" fill="#9F1239" />

      <!-- Horizontal Laser Scan Line (Spam Inspection) -->
      <line x1="6.5" y1="16.2" x2="37.5" y2="16.2" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.9" />

      <!-- Isolated / Flagged Threat Node in Chamber -->
      <circle cx="22" cy="16.2" r="2.2" fill="#FFFFFF" />

      <!-- Verified Clean Output Dot at Bottom -->
      <circle cx="22" cy="31.5" r="1.3" fill="#9F1239" />
    </g>
  </g>

  <!-- ENTERPRISE WORDMARK (Dark Mode — tuned for GitHub #0d1117): dgspamguard-data. -->
  <g transform="translate(64, 38)" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text font-size="30" letter-spacing="-0.8">
      <tspan fill="#F8FAFC" font-weight="700">dg</tspan><tspan fill="#CBD5E1" font-weight="600">spamguard</tspan><tspan fill="#FB7185" font-weight="700">-</tspan><tspan fill="#94A3B8" font-weight="500" font-size="26">data</tspan><tspan fill="#FB7185" font-weight="900">.</tspan>
    </text>
  </g>
</svg>
