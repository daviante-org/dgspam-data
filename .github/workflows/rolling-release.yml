name: Rolling Domain, URL & Mail Threat Dataset Release

on:
  schedule:
    # Polls twice per hour on off-peak minutes (:17 and :47 UTC) to avoid GitHub :00/:15 cron
    # congestion and automatically recover from delayed or dropped ticks after each 4-hour UTC
    # snapshot boundary (00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      dgspamguard_api_url:
        description: "Override DGSPAMGUARD API base URL (defaults to vars.DGSPAMGUARD_API_URL or https://dgspamguard.daviante.org)"
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: dgspamguard-rolling-release
  cancel-in-progress: false

jobs:
  publish-snapshot:
    name: Fetch, Verify, Publish & Prune DGSPAMGUARD Snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      API_BASE_URL: ${{ inputs.dgspamguard_api_url || vars.DGSPAMGUARD_API_URL || 'https://dgspamguard.daviante.org' }}

    steps:
      - name: Checkout dgspamguard-data
        uses: actions/checkout@v7

      - name: Check pending snapshots on DGSPAMGUARD API
        id: check
        shell: bash
        run: |
          set -euo pipefail
          API="${API_BASE_URL%/}"
          CURL_META_OPTS=(
            --fail --silent --show-error --location
            --connect-timeout 15 --max-time 60
            --retry 4 --retry-delay 5 --retry-all-errors
          )

          echo "Querying ${API}/v1/snapshots ..."
          curl "${CURL_META_OPTS[@]}" "${API}/v1/snapshots" -o /tmp/snapshots_list.json

          if ! jq -e '.snapshots | type == "array" and length > 0' /tmp/snapshots_list.json >/dev/null; then
            echo "::error::DGSPAMGUARD API returned no available snapshots."
            exit 1
          fi

          NEWEST_VERSION="$(jq -r '(.active_version // .snapshots[0].version) // empty' /tmp/snapshots_list.json)"
          if [[ ! "${NEWEST_VERSION}" =~ ^v[0-9]{8}\.[0-9]{4}(\.[0-9]+)?$ ]]; then
            echo "::error::Unexpected active snapshot version format: ${NEWEST_VERSION}"
            exit 1
          fi

          echo "Fetching existing releases in ${GITHUB_REPOSITORY} ..."
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | jq -s 'add // []' > /tmp/gh_releases.json

          # Use a 15-minute buffer inside the 7-day retention window so snapshots near expiry
          # are not uploaded right before pruning.
          BACKFILL_CUTOFF_ISO="$(date -u -d '10065 minutes ago' '+%Y-%m-%dT%H:%M:%SZ')"
          BACKFILL_CUTOFF_TAG="$(date -u -d '10065 minutes ago' '+v%Y%m%d.%H%M')"

          # Find all snapshots within the 7-day window that are not yet published (non-draft),
          # ordered oldest-to-newest so backfills and latest promotion occur chronologically.
          # Cap at 12 snapshots per run (48h of 4-hour slots) to stay well within disk/time limits.
          jq -r \
            --slurpfile rels /tmp/gh_releases.json \
            --arg cutoff "${BACKFILL_CUTOFF_ISO}" \
            --arg cutoff_tag "${BACKFILL_CUTOFF_TAG}" \
            --arg newest "${NEWEST_VERSION}" '
              ($rels[0] | map(select(.draft == false) | .tag_name)) as $published
              | [
                  .snapshots[]
                  | select(.version | test("^v[0-9]{8}\\.[0-9]{4}(\\.[0-9]+)?$"))
                  | select(
                      (.version == $newest)
                      or (
                        ((.created_at // "") >= $cutoff)
                        and (.version[0:14] >= $cutoff_tag)
                      )
                    )
                  | select((.version as $v | ($published | index($v))) == null)
                ]
              | sort_by(.created_at, .version)
              | .[-12:]
              | .[].version
            ' /tmp/snapshots_list.json > /tmp/pending_versions.txt

          mapfile -t PENDING < <(grep -v '^[[:space:]]*$' /tmp/pending_versions.txt || true)

          echo "newest_version=${NEWEST_VERSION}" >> "${GITHUB_OUTPUT}"
          if (( ${#PENDING[@]} == 0 )); then
            echo "All eligible snapshots (latest: ${NEWEST_VERSION}) already exist in ${GITHUB_REPOSITORY}; skipping upload."
            echo "has_pending=false" >> "${GITHUB_OUTPUT}"
          else
            echo "Found ${#PENDING[@]} unpublished snapshot(s) ready for publication: ${PENDING[*]}"
            echo "has_pending=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Download and verify snapshot artifacts
        if: steps.check.outputs.has_pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          API="${API_BASE_URL%/}"
          CURL_META_OPTS=(
            --fail --silent --show-error --location
            --connect-timeout 15 --max-time 60
            --retry 4 --retry-delay 5 --retry-all-errors
          )
          CURL_ASSET_OPTS=(
            --fail --silent --show-error --location
            --connect-timeout 15 --max-time 180
            --retry 4 --retry-delay 5 --retry-all-errors
          )

          # Verify all 9 canonical dataset files + bundle + manifest + SHA256SUMS exist and are non-empty
          REQUIRED_FILES=(
            "bundle.tar.gz"
            "manifest.json"
            "SHA256SUMS.txt"
            "dgspamguard-threat-domains.rpz.gz"
            "dgspamguard-threat-domains.csv.gz"
            "dgspamguard-threat-domains.txt.gz"
            "dgspamguard-threat-urls.csv.gz"
            "dgspamguard-smtp-ips.csv.gz"
            "dgspamguard-email-domains.csv.gz"
            "dgspamguard-malware-hashes.csv.gz"
            "dgspamguard-tld-risk.csv.gz"
            "dgmail-rules.json.gz"
          )

          mapfile -t PENDING < <(grep -v '^[[:space:]]*$' /tmp/pending_versions.txt || true)
          for ver in "${PENDING[@]}"; do
            [[ -z "${ver}" ]] && continue
            echo "=== Preparing snapshot ${ver} ==="
            SNAP_DIR="${RUNNER_TEMP}/release-assets/${ver}"
            ASSET_DIR="${SNAP_DIR}/assets"
            mkdir -p "${ASSET_DIR}"

            DETAIL_JSON="${SNAP_DIR}/detail.json"
            curl "${CURL_META_OPTS[@]}" "${API}/v1/snapshots/${ver}" -o "${DETAIL_JSON}"

            TITLE="$(jq -r '.release_title // empty' "${DETAIL_JSON}")"
            [[ -z "${TITLE}" ]] && TITLE="${ver}"
            printf '%s\n' "${TITLE}" > "${SNAP_DIR}/TITLE.txt"
            jq -r '.release_notes_md' "${DETAIL_JSON}" > "${SNAP_DIR}/RELEASE_NOTES.md"

            jq -r '
              [
                .bundle_download_path,
                .sha256sums_download_path,
                ("/v1/snapshots/" + .version + "/files/manifest.json"),
                (.files[].download_path)
              ] | unique | .[]
            ' "${DETAIL_JSON}" > "${SNAP_DIR}/ASSET_PATHS.txt"

            mapfile -t ASSET_PATHS < <(grep -v '^[[:space:]]*$' "${SNAP_DIR}/ASSET_PATHS.txt" || true)
            for rel_path in "${ASSET_PATHS[@]}"; do
              [[ -z "${rel_path}" ]] && continue
              fname="$(basename "${rel_path}")"
              echo "[${ver}] Downloading ${fname} ..."
              curl "${CURL_ASSET_OPTS[@]}" "${API}${rel_path}" -o "${ASSET_DIR}/${fname}"
            done
            rm -f "${SNAP_DIR}/ASSET_PATHS.txt" "${DETAIL_JSON}"

            for req in "${REQUIRED_FILES[@]}"; do
              if [[ ! -s "${ASSET_DIR}/${req}" ]]; then
                echo "::error::[${ver}] Missing or empty required artifact: ${req}"
                exit 1
              fi
            done

            # Enforce DGMail's 500 KB compressed fetch cap safety ceiling (<= 450,560 bytes / 440 KiB)
            RULES_BYTES="$(stat -c '%s' "${ASSET_DIR}/dgmail-rules.json.gz")"
            if (( RULES_BYTES > 450560 )); then
              echo "::error::[${ver}] dgmail-rules.json.gz (${RULES_BYTES} bytes) exceeds 440 KiB ceiling"
              exit 1
            fi
            gunzip -t "${ASSET_DIR}/dgmail-rules.json.gz"

            # Verify cryptographic SHA-256 digests and archive structure
            (
              cd "${ASSET_DIR}"
              sha256sum -c SHA256SUMS.txt
              tar -tzf bundle.tar.gz >/dev/null
            )
            echo "[${ver}] All 12 release assets verified cleanly."
          done

      - name: Generate keyless OIDC build provenance attestation
        if: steps.check.outputs.has_pending == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ${{ runner.temp }}/release-assets/*/assets/bundle.tar.gz
            ${{ runner.temp }}/release-assets/*/assets/*.gz
            ${{ runner.temp }}/release-assets/*/assets/manifest.json
            ${{ runner.temp }}/release-assets/*/assets/SHA256SUMS.txt

      - name: Mint mr-vegapunk GitHub App token
        if: steps.check.outputs.has_pending == 'true'
        id: vegapunk
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.VEGAPUNK_CLIENT_ID || 'Iv23li4BXFvpVa86toEJ' }}
          private-key: ${{ secrets.VEGAPUNK_PRIVATE_KEY }}
          permission-contents: write

      - name: Publish GitHub Release
        if: steps.check.outputs.has_pending == 'true'
        env:
          GH_TOKEN: ${{ steps.vegapunk.outputs.token || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          NEWEST_VER="${{ steps.check.outputs.newest_version }}"

          mapfile -t PENDING < <(grep -v '^[[:space:]]*$' /tmp/pending_versions.txt || true)
          for ver in "${PENDING[@]}"; do
            [[ -z "${ver}" ]] && continue
            SNAP_DIR="${RUNNER_TEMP}/release-assets/${ver}"
            ASSET_DIR="${SNAP_DIR}/assets"
            TITLE="$(head -n 1 "${SNAP_DIR}/TITLE.txt")"
            NOTES_FILE="${SNAP_DIR}/RELEASE_NOTES.md"

            # Clean up any incomplete draft left behind by an interrupted prior run
            if jq -e --arg v "${ver}" '.[] | select(.tag_name == $v and .draft == true)' /tmp/gh_releases.json >/dev/null; then
              echo "Removing incomplete draft release for ${ver} before re-uploading ..."
              gh release delete "${ver}" --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag < /dev/null || true
            fi

            echo "Publishing snapshot release ${ver} ..."
            # Create as draft first, upload all verified assets, then publish atomically
            gh release create "${ver}" \
              "${ASSET_DIR}/bundle.tar.gz" \
              "${ASSET_DIR}/dgspamguard-threat-domains.rpz.gz" \
              "${ASSET_DIR}/dgspamguard-threat-domains.csv.gz" \
              "${ASSET_DIR}/dgspamguard-threat-domains.txt.gz" \
              "${ASSET_DIR}/dgspamguard-threat-urls.csv.gz" \
              "${ASSET_DIR}/dgspamguard-smtp-ips.csv.gz" \
              "${ASSET_DIR}/dgspamguard-email-domains.csv.gz" \
              "${ASSET_DIR}/dgspamguard-malware-hashes.csv.gz" \
              "${ASSET_DIR}/dgspamguard-tld-risk.csv.gz" \
              "${ASSET_DIR}/dgmail-rules.json.gz" \
              "${ASSET_DIR}/manifest.json" \
              "${ASSET_DIR}/SHA256SUMS.txt" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${TITLE}" \
              --notes-file "${NOTES_FILE}" \
              --draft < /dev/null

            if [[ "${ver}" == "${NEWEST_VER}" ]]; then
              gh release edit "${ver}" \
                --repo "${GITHUB_REPOSITORY}" \
                --draft=false \
                --latest < /dev/null
            else
              gh release edit "${ver}" \
                --repo "${GITHUB_REPOSITORY}" \
                --draft=false \
                --latest=false < /dev/null
            fi

            rm -rf "${SNAP_DIR}"
          done

      - name: Mint mr-vegapunk token for 7-day rolling retention cleanup
        id: vegapunk_prune
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.VEGAPUNK_CLIENT_ID || 'Iv23li4BXFvpVa86toEJ' }}
          private-key: ${{ secrets.VEGAPUNK_PRIVATE_KEY }}
          permission-contents: write

      - name: Prune releases and tags older than 7 days
        env:
          GH_TOKEN: ${{ steps.vegapunk_prune.outputs.token || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          CUTOFF_ISO="$(date -u -d '7 days ago' '+%Y-%m-%dT%H:%M:%SZ')"
          CUTOFF_TAG="$(date -u -d '7 days ago' '+v%Y%m%d.%H%M')"
          echo "Pruning non-latest releases older than ${CUTOFF_ISO} (${CUTOFF_TAG}) ..."

          LATEST_TAG="$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName -q '.tagName' 2>/dev/null || true)"
          if [[ -z "${LATEST_TAG}" ]]; then
            echo "No latest release present yet; nothing to prune."
            exit 0
          fi

          mapfile -t EXPIRED_TAGS < <(
            gh api --paginate "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              | jq -r --arg cutoff "${CUTOFF_ISO}" --arg cutoff_tag "${CUTOFF_TAG}" --arg latest "${LATEST_TAG}" '
                  .[]
                  | select(.draft == false)
                  | select(.tag_name != $latest)
                  | select(
                      ((.published_at // .created_at) < $cutoff)
                      or ((.tag_name | test("^v[0-9]{8}\\.[0-9]{4}")) and (.tag_name[0:14] < $cutoff_tag))
                    )
                  | .tag_name
                '
          )
          for old_tag in "${EXPIRED_TAGS[@]}"; do
            [[ -z "${old_tag}" ]] && continue
            echo "Deleting expired >7d snapshot release & git tag: ${old_tag}"
            gh release delete "${old_tag}" --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag < /dev/null
          done
